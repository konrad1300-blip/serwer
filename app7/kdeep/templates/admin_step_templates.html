{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between">
    <h3><i class="fas fa-cubes"></i> Szablony kroków (samodzielne)</h3>
    <a href="{{ url_for('add_step_template') }}" class="btn btn-primary">+ Nowy szablon kroku</a>
</div>
<hr>
<table class="table table-hover">
    <thead>
        <tr><th>Nazwa</th><th>Opis</th><th>Godziny</th><th>Wymagane role</th><th>Akcje</th></tr>
    </thead>
    <tbody>
    {% for step in steps %}
    <tr>
        <td>{{ step.name }}</td>
        <td>{{ step.description or '' }}</td>
        <td>{{ step.planned_hours }}</td>
        <td>{{ step.required_roles or '' }}</td>
        <td>
            <a href="{{ url_for('edit_step_template', step_id=step.id) }}" class="btn btn-sm btn-outline-primary">Edytuj</a>
            <a href="{{ url_for('delete_step_template', step_id=step.id) }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Usunąć szablon?')">Usuń</a>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
